name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/resourcey
      - name: Unit tests with coverage
        run: uv run pytest tests/unit -q -n 0 --cov=resourcey --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint
      - name: Install the Quint Rust evaluator
        # `quint test` / `quint run` download this binary via the unauthenticated
        # GitHub releases API, which rate-limits shared runner IPs. Fetch it from
        # the direct release URL instead and pre-seed the CLI's cache.
        run: scripts/install_quint_evaluator.sh
      - name: Typecheck all specs
        run: |
          for f in specs/*.qnt; do
            echo "::group::typecheck $f"
            quint typecheck "$f"
            echo "::endgroup::"
          done
      - name: Run Quint tests
        run: quint test specs/resource_actions.qnt --main=resource_actions --match "^(createThenRead|createUpdateDelete|batchReadAndEdit|searchEmptyFilterMatchesAll|searchEqualityPredicate|searchInPredicate|searchEmptyInMatchesNothing|searchAndCombinesPredicates|searchNoFilterDeclaredRejectsNonEmptyFilter|readOnlyResourceExposesReadSubset|writableResourceExposesAllActions|readOnlyResourceServesReads|defensiveReadIsolated|nonDefensiveServesStore)$"
      - name: Run permissions spec tests
        run: quint test specs/permissions.qnt --main=permissions --match "^(allowAllIsAllForEveryAction|denyAllIsNoneForEveryAction|readOnlyGrantsReadLikeAndDeniesTheRest|normalizeActionReducesDerivedMembers|enforcementMatrix|enforcementAllowsEverything|allowAllGrantsAccess|denyAllBlocksAccess|emptyPoliciesDenies|readOnlyGrantsReadNotCreate|denyDoesNotOverrideGrant|unionCombinesGrants|invariantsHold)$"
      - name: Run roles spec tests
        run: quint test specs/roles.qnt --main=roles --match "^(allowAllIsAllForEveryAction|denyAllIsNoneForEveryAction|readOnlyGrantsReadLikeAndDeniesTheRest|normalizeActionReducesDerivedMembers|ownerPolicyScoping|unknownRoleGrantsNothing|unroledCallerUsesTheClosedDefault|perResourceScoping|readsAllOfXOwnRowsOfY|multipleRolesUnionTheirGrants|denyRoleDoesNotOverrideAGrant|invariantsHold)$"
      - name: Run exposure spec tests
        run: quint test specs/exposure.qnt --main=exposure --match "^(selfIsTheDefault|hiddenRegistersNoRoutesTest|wrapperHidesAnExposedResource|wrapperNarrowsTheQuerySurface|delegatedWrapperWouldLeak|builderDoesNotChangeExposure|narrowingIsAllowedWideningIsRejected|batchEditAdmitsOnlyDeclaredActions|batchActionsRequireTheirSingularTest|defaultBuilderIsIdentityTest|wrappedBuilderPreservesTheActionContractTest|invariantsHold)$"
      - name: Run DTO-defaults spec tests
        run: quint test specs/dto_defaults.qnt --main=dto_defaults --match "^(bareUuidIdIsGenerated|customIdentifierStaysClientSupplied|explicitIntentIsHonouredVerbatim|columnDefaultWins|timestampsAreFrameworkOwnedTest|contradictoryDefaultsAreRejected|invariantsHold)$"
      - name: Run API-key spec tests
        run: quint test specs/api_key.qnt --main=api_key --match "^(keyIsAbsentFromTheWriteModels|keyIsAbsentFromTheReadModel|onlyCreateDisclosesTheKey|querySurfaceExcludesTheKey|storedValueIsOnlyTheDigest|createRevealsTheStoredKey|presentedKeyAuthenticatesByDigest|updateCannotRotateTheKey|invariantsHold)$"
      - name: Run auth spec tests
        run: quint test specs/auth.qnt --main=auth --match "^(emptyStoreDeniesEverything|absentAndInvalidAreIndistinguishable|aValidKeyGrantsAccess|theCheckRunsBeforeTargetStorage|theKeyServiceOwnsItsOwnContext|invariantsHold)$"
      - name: Run secret-serialization spec tests
        run: quint test specs/secret_serialization.qnt --main=secret_serialization --match "^(defaultRedacts|exposeRevealsThePlaintext|encryptionTakesPrecedence|outputDependsOnlyOnTheContext|encryptionRoundTrips|invariantsHold)$"
      - name: Run filtering spec tests
        run: quint test specs/filtering.qnt --main=filtering --match "^(law1_normalisationPreserves|law2_nullSafeNegation|law3_nullSafeNegationGeneralises|law4_positivePushdownIsSound|law5_inFilterAgreesWithEqAndOr)$"
      - name: Run sorting spec tests
        run: quint test specs/sorting.qnt --main=sorting --match "^(law1_totalOrder|law2_keysetAgreement|law3_descendingIsTheMirror|law4_cursorSortBinding)$"
      - name: Run cache-defaults spec tests
        run: quint test specs/cache_defaults.qnt --main=cache_defaults --match "^(readOnlyIsOptimistic|writeActionForcesValidator|writableWithUpdatedAtGetsLastModified|writableWithoutUpdatedAtGetsEtag|readOnlyDefaultHasPositiveWindow|readOnlyWindowIsPrivate|selectionIsTotal|invariantsHold)$"
      - name: Run rbac spec tests
        run: quint test specs/rbac.qnt --main=rbac --match "^(allowAllMatchesEveryRow|denyAllMatchesNothing|readOnlyMatchesReadLike|creatorScopesToOwnedRows|groupMemberMatchesOwnGroups|aclMatchesItsIds|resolutionWalksGroupsToRolesToPermissions|resourceScopingFiltersOtherResources|scopedQueryIsComplete|unknownUserIsFailClosed|emptyPermissionSetIsFailClosed|multipleRolesUnionTheirGrants|denyDoesNotOverrideAGrant|aclsUnionToOneSet|setLeafMatchesTheJoin|thresholdBoundsMembershipChange|callerScopingIsDerivedFromPolicies|invariantsHold)$"
      - name: Run filestore spec tests
        run: quint test specs/filestore.qnt --main=filestore --match "^(handshakeReachesReady|completeRequiresAnObject|completeVerifiesSize|completeIsIdempotentOnce|downloadRequiresReady|uploadRequiresARow|keysAreUnique|capabilityIsBound|deleteRemovesTheObject|invariantsHold)$"
      - name: Check invariants
        run: |
          quint run specs/resource_actions.qnt --main=resource_actions --invariant=keysAreBelowCounter --max-steps=100

  examples-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: examples/01_message_board
            name: message-board (SQLite)
          - example: examples/02_mongodb
            name: message-board (MongoDB)
          - example: examples/03_api_key_auth
            name: api-key-auth (env API key)
          - example: examples/04_simple_roles
            name: simple-roles (role-based API keys)
          - example: examples/05_full_rbac
            name: full-rbac (stored users/groups/roles)
    name: E2E — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install example dependencies
        working-directory: ${{ matrix.example }}
        # The example's [tool.uv.sources] override resolves resourcey from the
        # parent checkout, so this sync installs the code under review — no
        # separate overlay of the PR source is needed.
        run: uv sync --extra test
      - name: Run E2E suite
        working-directory: ${{ matrix.example }}
        run: uv run pytest -q
