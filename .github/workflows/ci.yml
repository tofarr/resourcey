name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/resourcey
      - name: Unit tests with coverage
        run: uv run pytest tests/unit -q -n 0 --cov=resourcey --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint
      - name: Typecheck all specs
        run: |
          for f in specs/*.qnt; do
            echo "::group::typecheck $f"
            quint typecheck "$f"
            echo "::endgroup::"
          done
      - name: Run Quint tests
        run: quint test specs/resource_actions.qnt --main=resource_actions --match "^(createThenRead|createUpdateDelete|batchReadAndEdit|searchEmptyFilterMatchesAll|searchEqualityPredicate|searchInPredicate|searchEmptyInMatchesNothing|searchAndCombinesPredicates|searchNoFilterDeclaredRejectsNonEmptyFilter|readOnlyResourceExposesReadSubset|writableResourceExposesAllActions|readOnlyResourceServesReads|defensiveReadIsolated|nonDefensiveServesStore)$"
      - name: Run exposure spec tests
        run: quint test specs/exposure.qnt --main=exposure --match "^(selfIsTheDefault|hiddenRegistersNoRoutesTest|wrapperHidesAnExposedResource|wrapperNarrowsTheQuerySurface|delegatedWrapperWouldLeak|builderDoesNotChangeExposure|narrowingIsAllowedWideningIsRejected|invariantsHold)$"
      - name: Check invariants
        run: |
          quint run specs/resource_actions.qnt --main=resource_actions --invariant=keysAreBelowCounter --max-steps=100

  examples-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: examples/01_message_board
            name: message-board (SQLite)
          - example: examples/02_mongodb
            name: message-board (MongoDB)
          - example: examples/03_api_key_auth
            name: api-key-auth (env API key)
    name: E2E — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install example dependencies
        working-directory: ${{ matrix.example }}
        # The example's [tool.uv.sources] override resolves resourcey from the
        # parent checkout, so this sync installs the code under review — no
        # separate overlay of the PR source is needed.
        run: uv sync --extra test
      - name: Run E2E suite
        working-directory: ${{ matrix.example }}
        run: uv run pytest -q
