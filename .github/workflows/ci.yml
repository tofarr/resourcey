name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml so a tag cannot publish code that has not passed
  # every gate here.
  workflow_call:

jobs:
  lint-type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/resourcey
      - name: Unit tests with coverage
        run: uv run pytest tests/unit -q -n 0 --cov=resourcey --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint
      # The spec set, the per-spec run names, and the evaluator pre-seed all
      # live in the Makefile's `specs` target only, so CI and a local
      # `make specs` cannot drift apart.
      - name: Typecheck and run all specs
        run: make specs

  examples-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: examples/01_message_board
            name: message-board (SQLite)
          - example: examples/02_mongodb
            name: message-board (MongoDB)
          - example: examples/03_api_key_auth
            name: api-key-auth (env API key)
          - example: examples/04_simple_roles
            name: simple-roles (role-based API keys)
          - example: examples/05_full_rbac
            name: full-rbac (stored users/groups/roles)
          - example: examples/06_filestore
            name: filestore (pre-signed upload/download)
          - example: examples/07_oauth
            name: oauth (OIDC federation + BFF session)
          - example: examples/08_webhooks
            name: webhooks (edit-event triggers)
          - example: examples/09_realtime
            name: realtime (WebSocket channel over a Trigger)
          - example: examples/10_jobs
            name: jobs (durable, claimable background jobs)
    name: E2E — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install example dependencies
        working-directory: ${{ matrix.example }}
        # The example's [tool.uv.sources] override resolves resourcey from the
        # parent checkout, so this sync installs the code under review — no
        # separate overlay of the PR source is needed.
        run: uv sync --extra test
      - name: Run E2E suite
        working-directory: ${{ matrix.example }}
        run: uv run pytest -q
