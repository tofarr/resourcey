name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/resourcey
      - name: Unit tests with coverage
        run: uv run pytest tests/unit -q -n 0 --cov=resourcey --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint
      - name: Typecheck all specs
        run: |
          for f in specs/*.qnt; do
            echo "::group::typecheck $f"
            quint typecheck "$f"
            echo "::endgroup::"
          done
      - name: Run Quint tests
        run: quint test specs/resource_actions.qnt --main=resource_actions
      - name: Check invariants
        run: |
          quint run specs/resource_actions.qnt --main=resource_actions --invariant=keysAreBelowCounter --max-steps=100
