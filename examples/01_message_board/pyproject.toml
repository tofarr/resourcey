[project]
name = "message-board"
version = "0.1.0"
description = "Example 01 — a message board app built on resourcey (SQLite by default)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pull resourcey from its main branch on GitHub. This mirrors the real
    # consumer situation: copy this directory anywhere, `uv sync`, and run.
    "resourcey @ git+https://github.com/tofarr/resourcey.git@main",
    # SQLite async driver — the example defaults to a local SQLite file.
    "aiosqlite>=0.22",
]

[project.scripts]
message-board = "message_board.app:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["message_board"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]
