# Alembic configuration for the file-store example.
#
# SQLAlchemy is the schema of record, so the example drives Alembic directly
# against the ORM models' own metadata (there is no `resourcey migrate`
# wrapper).
#
# The URL is not stored here: env.py reads APP_SQL_CONNECTIONS_0_URL (the same
# value the app uses) so the migration and the app always agree on the target.

[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
