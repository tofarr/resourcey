[project]
name = "mongodb-message-board"
version = "0.1.0"
description = "Example 02 — a message board app built on resourcey with MongoDB (embedded mongomock by default)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pull resourcey from its main branch on GitHub. This mirrors the real
    # consumer situation: copy this directory anywhere, `uv sync`, and run.
    "resourcey[mongodb] @ git+https://github.com/tofarr/resourcey.git@main",
    # Embedded MongoDB (mongomock) for local development / testing.
    "mongomock>=4.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
mongodb-message-board = "message_board.app:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["message_board"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
