[project]
name = "resourcey"
version = "0.1.0"
description = "A resource-oriented Python web framework built on FastAPI, SQLAlchemy, and Alembic — progressive enhancement with escape hatches to the underlying stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tofarr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "joserfc>=1.7.5",
    "bcrypt>=5.0.0",
    "httpx>=0.27",
]

[project.scripts]
resourcey = "resourcey.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "aiosqlite>=0.22",
    "ruff>=0.5",
    "mypy>=1.10",
    "mongomock>=4.3",
    # Embedded Mongo client (resourcey.mongo.embedded) imports pymongo
    # directly; pin it in dev so it resolves without the mongodb extra.
    "pymongo>=4.18.1",
]
mongodb = [
    "motor>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resourcey"]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["resourcey"]
omit = ["tests/*"]

[tool.coverage.report]
# 90% gate enforced in CI / `make test`. precision > 0 so pytest-cov's
# fail-under check does not round 89.9% up to 90%.
precision = 2
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Examples are standalone projects (own pyproject.toml + tooling); not linted
# by the root config.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["resourcey"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# Vendored utilities (env_parser, models) originated from a non-strict
# codebase. They are correct but not yet fully annotated for --strict.
# They are excluded from the strict check; remove the exclude once the
# vendored code is fully annotated.
exclude = [
    "src/resourcey/util/env_parser\\.py",
    "src/resourcey/util/models\\.py",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
